# Go lint for ayis (docs/plans/production-readiness.md, P0). Report-only in CI
# until the existing findings are fixed; then it blocks. Thresholds start at
# today's worst and only go down.
version: "2"

run:
  timeout: 5m

linters:
  default: standard        # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - gocritic
    - dupl
    - gocyclo
    - bodyclose
    - nilerr
  settings:
    gocyclo:
      # cmd/ayis run() was 113 until P2 made it a table; today's worst is
      # inventory.Read at 62. Lowered as each offender is split - the goal is 40.
      min-complexity: 65
    dupl:
      threshold: 200
  exclusions:
    rules:
      # Tests repeat set-up on purpose: each case reads on its own.
      - path: _test\.go
        linters: [dupl, gocyclo]
