# Ruff for the cloud watchdog (docs/plans/production-readiness.md, P0).
# Report-only in CI until today's findings are fixed; then it blocks.
target-version = "py312"   # the Lambda runtime
line-length = 130
include = ["lambda/**/*.py", "tools/**/*.py"]

[lint]
select = ["E", "F", "W", "B", "UP", "SIM", "PL", "RUF"]
ignore = [
  "PLR2004",  # magic numbers: the watchdog's thresholds are named where they matter
  "PLR0913",  # boto3 clients are passed explicitly, so tests can pass fakes
  "PLR0917",  # the same, positionally
  "UP031",    # %-formatting is the watchdog's one consistent style
  "PLC0415",  # boto3 is imported in the handler: the tests run without it
]
