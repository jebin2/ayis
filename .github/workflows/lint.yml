# Linters for every language in ayis (docs/plans/production-readiness.md, P0).
#
# REPORT-ONLY for now: each job may fail without failing the push, so today's
# findings can be fixed in their own changes. Once a language is clean its job
# loses `continue-on-error` and blocks like the tests do. Configs: .golangci.yml,
# app/eslint.config.mjs, ruff.toml. Nothing here touches AWS.
name: Lint

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (golangci-lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Built with the module's own Go: a prebuilt binary older than go.mod refuses to run.
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          "$(go env GOPATH)/bin/golangci-lint" run ./...
        shell: bash

  js:
    name: App (ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - name: ESLint
        working-directory: ./app
        run: |
          npm ci
          npx eslint .
        shell: bash

  python:
    name: Watchdog (Ruff, mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'   # the Lambda runtime
      - run: pip install ruff==0.17.6 mypy==2.4.1
      - name: Ruff
        run: ruff check
      - name: mypy
        run: mypy --ignore-missing-imports lambda/cloud_watchdog.py
      # The P4 goal; reported, not yet required.
      - name: mypy --strict (goal)
        run: mypy --strict --ignore-missing-imports lambda/cloud_watchdog.py || true

  shell:
    name: Scripts (ShellCheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - run: pip install shellcheck-py==0.11.0.1
      - name: ShellCheck
        run: tools/ci/shell-files.sh | xargs shellcheck -s bash --severity=warning
        shell: bash
